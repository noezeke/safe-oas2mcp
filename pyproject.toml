[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-oas2mcp"
version = "0.1.0"
description = "OpenAPI to MCP, safely."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["openapi", "swagger", "mcp", "model-context-protocol", "agent", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/noezeke/safe-oas2mcp"
Repository = "https://github.com/noezeke/safe-oas2mcp"
Issues = "https://github.com/noezeke/safe-oas2mcp/issues"

[project.scripts]
safe-oas2mcp = "safe_oas2mcp.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["safe_oas2mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["safe_oas2mcp"]
