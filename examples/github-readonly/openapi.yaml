openapi: 3.0.3
info:
  title: GitHub Readonly Demo API
  version: 1.0.0
servers:
  - url: https://api.github.com
paths:
  /repos/{owner}/{repo}:
    get:
      operationId: getRepository
      summary: Get repository metadata
      tags: [github, repository]
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /repos/{owner}/{repo}/issues:
    get:
      operationId: listRepositoryIssues
      summary: List repository issues
      tags: [github, issues]
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed, all]
      responses:
        "200":
          description: OK

