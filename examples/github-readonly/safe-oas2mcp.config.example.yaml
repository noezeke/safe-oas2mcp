base_url: https://api.github.com

auth:
  type: bearer
  token_env: GITHUB_TOKEN

headers:
  X-GitHub-Api-Version:
    value: "2022-11-28"
  Accept:
    value: application/vnd.github+json

policy:
  include:
    - "GET /repos/{owner}/{repo}"
    - "GET /repos/{owner}/{repo}/issues"

audit:
  enabled: false

